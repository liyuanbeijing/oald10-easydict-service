services:
  oald10:
    container_name: oald10-service
    image: oald10-easydict-service:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
    environment:
      OALD10_DATA_PATH: /data
    ports:
      - ${OALD10_PORT}:33070
    volumes:
      - type: bind
        source: ${OALD10_DATA_PATH}
        target: /data
        read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:33070/health', timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
